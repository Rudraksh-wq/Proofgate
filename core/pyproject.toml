[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofgate"
version = "0.0.1"
description = "Local security gate for the AI coding loop"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "httpx>=0.27", "packaging>=23", "pglast>=7"]

[project.optional-dependencies]
ai = ["google-genai>=1"]
dev = ["google-genai>=1", "pytest>=8", "pytest-asyncio>=0.23", "flask>=3", "pyyaml>=6", "bandit>=1.7", "pglast>=7"]

[project.scripts]
proofgate = "proofgate.cli:main"

[tool.setuptools.packages.find]
include = ["proofgate*"]

[tool.setuptools.package-data]
proofgate = ["tools.lock.json", "rules/*.yaml", "data/*.json"]

