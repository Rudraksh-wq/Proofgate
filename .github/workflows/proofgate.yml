# ProofGate CI: run the fast layers on every push and pull request, fail the build on high or critical findings,
# and show the results in GitHub's code-scanning tab (SARIF).
#
# Copy this file into your own repository. Change TARGET to "." (or your app folder) and, if you prefer, install the
# released package (`pip install proofgate`) instead of `./core`.
#
# Every action is pinned by its full commit SHA (a tag can be moved; a SHA cannot). Update the SHAs deliberately.
name: ProofGate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: proofgate-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET: core/proofgate   # what to scan. In your repo: "."

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install ProofGate
        run: pip install ./core

      - name: Check the tools (missing tools are skipped and recorded, never run unverified)
        run: proofgate doctor

      - name: Scan (fast layers)
        id: scan
        run: |
          set +e
          proofgate scan "$TARGET" --fast --fail-on high --format sarif > /dev/null
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # exit 0 clean, 1 findings at or above --fail-on, 2 a layer or tool failed (never treated as clean)
          exit 0

      - name: Upload SARIF to code scanning
        if: always() && hashFiles(format('{0}/.proofgate/report.sarif', env.TARGET)) != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: ${{ env.TARGET }}/.proofgate/report.sarif
          category: proofgate

      - name: Keep the local report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proofgate-report
          path: |
            ${{ env.TARGET }}/.proofgate/report.json
            ${{ env.TARGET }}/.proofgate/report.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Gate
        if: steps.scan.outputs.code != '0'
        run: |
          echo "ProofGate exit code ${{ steps.scan.outputs.code }}: 1 = findings at or above high, 2 = a layer or tool failed (not a clean result)."
          exit "${{ steps.scan.outputs.code }}"
