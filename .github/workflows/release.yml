# Release: build the package, publish it to PyPI with Trusted Publishing (no token), then register it in the MCP registry.
#
# PyPI Trusted Publishing is configured for project "proofgate-ai": owner Rudraksh-wq, repo Proofgate,
# workflow release.yml, environment pypi. Those four values must match this file exactly.
#
# Runs only when a tag like v0.1.0 is pushed. The tag must equal the version in core/pyproject.toml and server.json.
# Every action is pinned by its full commit SHA. mcp-publisher is pinned by release and SHA-256.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check the tag matches the package and registry versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, tomllib
          tag = os.environ["TAG"].removeprefix("v")
          proj = tomllib.load(open("core/pyproject.toml", "rb"))["project"]
          srv = json.load(open("server.json"))
          assert proj["name"] == srv["packages"][0]["identifier"] == "proofgate-ai", "package name mismatch"
          assert tag == proj["version"] == srv["version"] == srv["packages"][0]["version"], f"tag {tag} != pyproject {proj['version']} / server.json {srv['version']}"
          PY

      - name: Build sdist and wheel
        run: |
          python -m pip install build==1.2.2.post1
          python -m build core --outdir dist

      - name: Check the wheel installs and runs
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/proofgate --help
          /tmp/smoke/bin/python -c "import proofgate"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write   # Trusted Publishing: PyPI exchanges this OIDC token for a short-lived upload token
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  publish-mcp-registry:
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write   # github-oidc login for the io.github.Rudraksh-wq/* namespace
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mcp-publisher (pinned release, checked SHA-256)
        run: |
          curl -fsSL --retry 3 -o mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.10/mcp-publisher_linux_amd64.tar.gz
          echo "32d287ed6fb7dc04eddd2621097784c06a355b2348b35ccc630a1643aa75ff4a  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Log in with GitHub OIDC and publish server.json
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
